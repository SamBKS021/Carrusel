<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallpaper Personal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wallpaper">
    <aside class="sidebar">
      <img id="sidebarImage" class="sidebar-image" alt="Imagen vertical" />
      <canvas id="particleCanvas" class="particle-canvas" aria-hidden="true"></canvas>

      <div class="sidebar-overlay">
        <div class="time-block">
          <div id="hora" class="hora">00:00</div>
          <div id="fecha" class="fecha">Lunes, 1 de enero</div>
          <figure id="frase" class="frase" aria-live="polite">
            <blockquote id="fraseTexto" class="frase-texto"></blockquote>
            <figcaption id="fraseAutor" class="frase-autor"></figcaption>
          </figure>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="content-grid">
        <div class="content-primary">
          <section class="top-gallery" aria-label="Imagenes destacadas">
            <article class="gallery-card">
              <img src="assets/carousel/01.jpeg" alt="Imagen destacada 1" />
            </article>
            <article class="gallery-card">
              <img src="assets/carousel/02.jpeg" alt="Imagen destacada 2" />
            </article>
            <article class="gallery-card">
              <img src="assets/carousel/03.jpeg" alt="Imagen destacada 3" />
            </article>
            <article class="gallery-card">
              <img src="assets/carousel/04.jpeg" alt="Imagen destacada 4" />
            </article>
          </section>

          <section class="center-stage" aria-label="Contenido central pendiente">
            <div class="center-stage-inner"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="quotes.js"></script>
  <script src="script.js"></script>
</body>
</html>
